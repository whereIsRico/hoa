name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # No lint or test script exists on the backend yet (see package.json)
      # and there's no Postgres available in CI to run anything DB-backed,
      # so this is a floor, not real coverage: every source file must at
      # least parse cleanly.
      - run: find src -name '*.js' -print0 | xargs -0 -n1 node -c
