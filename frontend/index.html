<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palisade</title>
    <script>
      (function () {
        // Runs before React mounts so there's no flash of the wrong theme.
        // Mirrors ThemeToggle.jsx's own getInitialTheme(): stored preference
        // wins, otherwise fall back to the OS setting.
        var stored = localStorage.getItem('passage.theme')
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
